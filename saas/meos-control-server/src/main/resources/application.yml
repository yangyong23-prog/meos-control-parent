# ------------------------- Tomcat Setting -------------------------
server:
  port: 8089

# ------------------------- Spring Setting -------------------------
spring:
  profiles:
    include:
      - actuator
      - db
      - paas
      - redis
      - kafka
      - rabbitmq
      - task
      - xxljob
      - tenant
      - knife4j
  jackson:
    time-zone: GMT+8
  flyway:
    enabled: false

# ------------------------- Feign Setting -------------------------
feign:
  client:
    config:
      default:
        read-timeout: 300000
  httpclient:
    enabled: false
  okhttp:
    enabled: true

#默认数据库名称
persagy.db_name.meos_control: meos_control
# 引擎图标host
system.legend.icon.host: ${external-url.paas.gateway.service:}/dtp-relational-graph-server/

logging.level.'org.apache.kafka.clients.NetworkClient': error
logging.level.'org.springframework.kafka.listener.KafkaMessageListenerContainer': warn
logging.level.'org.apache.kafka.clients.consumer.internals.AbstractCoordinator': warn
logging.level.'org.apache.kafka.clients.consumer.internals.ConsumerCoordinator': warn
# 弱电系统关系配置
weak-power:
  # 最大层级深度限制
  max-hierarchy-depth: 10
  # 动态关系配置
  relations:
    - master: "服务器"
      masterCode: "WEICSV"
      graphType: "WENetwork"
      edgeType: "Normal"
      slaveTypes:              # to端可能出现的所有类型
        - "服务器"
        - "网关"
        - "DDC直接数字控制器"
        - "PLC可编程逻辑控制器"
        - "数据采集器"
        - "各类传感器"
      remark: ~
    - master: "网关"
      masterCode: "WENCGW"
      graphType: "WENetwork"
      edgeType: "Normal"
      slaveTypes:
        - "传感器等"
        - "服务器"
        - "控制器"
        - "采集器"
      remark: ~
    - master: "DDC直接数字控制器"
      masterCode: "WEFCDD"
      graphType: "MechCtrl"
      edgeType: "EqCtrl"
      slaveTypes:
        - "末端冷机等设备实例"
      remark: "两种关系都需要查询，结果取并集"
    - master: "DDC直接数字控制器"
      masterCode: "WEFCDD"
      graphType: "WENetwork"
      edgeType: "Normal"
      slaveTypes:
        - "各类传感器"
        - "电水表"
        - "服务器网关等"
      remark: "两种关系都需要查询，结果取并集"
    - master: "PLC可编程逻辑控制器"
      masterCode: "WEFCPL"
      graphType: "MechCtrl"
      edgeType: "EqCtrl"
      slaveTypes:
        - "水泵等设备实例等"
      remark: "两种关系都需要查询，结果取并集"
    - master: "PLC可编程逻辑控制器"
      masterCode: "WEFCPL"
      graphType: "WENetwork"
      edgeType: "Normal"
      slaveTypes:
        - "各类传感器"
        - "服务器网关等"
      remark: ~
    - master: "数据采集器"
      masterCode: "WEFCDC"
      graphType: "WENetwork"
      edgeType: "Normal"
      slaveTypes:
        - "各类传感器"
        - "服务器网关等"
      remark: ~

  # 中间设备类型（需要继续查询的设备）
  intermediate-device-types:
    - "WEICSV"  # 服务器
    - "WENCGW"  # 网关
    - "WEFCDD"  # DDC直接数字控制器
    - "WEFCPL"  # PLC可编程逻辑控制器
    - "WEFCDC"  # 数据采集器